name: uptime-monitor

on:
  schedule:
    # */5 is the minimum GitHub accepts, but it is a REQUEST, not a promise.
    # Measured 5.8-9.8 (96h, 82 probing runs): the median gap between run STARTS
    # was 56.8 min, mean 71.8, worst 350 min. GitHub throttles scheduled
    # workflows hard and there is no way to force it. The real probe cadence
    # therefore comes from the in-job loop below, not from this cron line.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      selftest:
        description: 'Self-test: send one marked test alert email to verify the pipe'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write          # open/close outage issues (dedup state)

concurrency:
  group: uptime-monitor
  cancel-in-progress: false   # a live probing loop is never killed by a new tick

env:
  # How long one job keeps probing every 5 min. This single number IS the
  # coverage knob. Measured against the real 5.8-9.8 start times:
  #     50 min ->  65% of wall-clock covered, worst blind window 300 min
  #    110 min ->  89%,  8 blind windows
  #    170 min ->  95%,  5 blind windows, worst 180 min   <-- chosen
  #    230 min ->  98%
  #    350 min -> 100%  (but a code fix then takes ~6h to reach production)
  # 170 keeps coverage high while a pushed fix still lands within ~3h.
  PROBE_WINDOW_MIN: 170

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Must exceed PROBE_WINDOW_MIN plus the last iteration's own runtime.
    # A real multi-target failure needs ~2 min per DOWN target (retries + waits).
    timeout-minutes: 178
    steps:
      - uses: actions/checkout@v4

      - name: Run uptime checks
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}          # issues on THIS repo (dedup state)
          # Read-only PAT (contents:read on the 4 product repos) for the deploy-drift
          # check to read each repo's HEAD. Optional: if the secret is unset the
          # drift check is skipped and only uptime runs. Never put a token in code.
          REPO_HEAD_TOKEN: ${{ secrets.REPO_HEAD_TOKEN }}
        run: |
          if [ "${{ inputs.selftest }}" = "true" ]; then
            bash check.sh selftest
          else
            # One job = one long probing window at a true 5-min cadence. Because
            # the concurrency group is never cancelled in-progress, GitHub parks
            # one pending run behind this job and starts it the moment this one
            # ends - so windows butt up against each other instead of leaving
            # the ~57-min holes the raw cron leaves.
            END=$(( SECONDS + PROBE_WINDOW_MIN * 60 ))
            while :; do
              bash check.sh || true
              [ $SECONDS -ge $END ] && break
              sleep 300
            done
          fi
