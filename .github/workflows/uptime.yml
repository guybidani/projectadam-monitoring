name: uptime-monitor

on:
  schedule:
    # every 5 minutes — GitHub may delay under load; this is the min allowed interval
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      selftest:
        description: 'Self-test: send one marked test alert email to verify the pipe'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write          # open/close outage issues (dedup state)

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # A real multi-product outage needs ~90s per DOWN target (3 probes + waits +
    # alert + issue). The old 5-min timeout killed the 5.8 outage run mid-flight:
    # alerts went out but issues/recovery never happened. 58 covers the loop below.
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - name: Run uptime checks
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}          # issues on THIS repo (dedup state)
          # Read-only PAT (contents:read on the 4 product repos) for the deploy-drift
          # check to read each repo's HEAD. Optional: if the secret is unset the
          # drift check is skipped and only uptime runs. Never put a token in code.
          REPO_HEAD_TOKEN: ${{ secrets.REPO_HEAD_TOKEN }}
        run: |
          if [ "${{ inputs.selftest }}" = "true" ]; then
            bash check.sh selftest
          else
            # GitHub throttles */5 schedules hard (measured 5.8: runs started
            # ~2h apart). So each run probes every ~5 min for up to 50 min; the
            # concurrency group queues at most one pending run behind it. Even
            # at one run start per hour this keeps real probe cadence ≈5 min.
            END=$((SECONDS + 3000))
            while :; do
              bash check.sh || true
              [ $SECONDS -ge $END ] && break
              sleep 300
            done
          fi
