name: uptime-monitor

on:
  schedule:
    # BACKUP cadence since 2026-08-12. The PRIMARY uptime source is the
    # Cloudflare Worker `vixy-worker-monitor` (true 5-min cron, JSON-field
    # checks, alerts to support@vixy.co.il, verified end-to-end 11.8). This
    # workflow is the independent second vantage - it shares fate with neither
    # the VPS nor Cloudflare - and it carries the deploy-drift check.
    #
    # Why hourly and not */5: (a) a backup does not need 5-min cadence;
    # (b) GitHub throttles schedule crons anyway (measured 5.8-9.8: median gap
    # between run starts 56.8 min at */5); (c) the 170-min in-job probe loop
    # that compensated for the throttling is exactly what amplified the false
    # HTTP 000 noise - one blackholed runner stayed blind for a whole ~3 h
    # window (see check.sh header: root cause diagnosed 12.8, a TCP blackhole
    # between some GitHub runner subnets and Hostinger's edge, upstream of the
    # VPS, unfixable from our side).
    # Minute 7, not 0: the top of the hour is the scheduler's busiest slot.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      selftest:
        description: 'Self-test: send one marked test alert email to verify the pipe'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write          # open/close outage issues (dedup state)

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Single pass. Worst case is all 7 targets transport-failing:
    # 7 x (5 retries x 20 s timeout + 4 x 20 s wait) = 21 min, plus overhead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run uptime checks
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}          # issues on THIS repo (dedup state)
          # Read-only PAT (contents:read on the 4 product repos) for the deploy-drift
          # check to read each repo's HEAD. Optional: if the secret is unset the
          # drift check is skipped and only uptime runs. Never put a token in code.
          REPO_HEAD_TOKEN: ${{ secrets.REPO_HEAD_TOKEN }}
        run: |
          if [ "${{ inputs.selftest }}" = "true" ]; then
            bash check.sh selftest
          else
            bash check.sh
          fi
